name: Build and Deploy to cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build React App
        run: npm run build

      - name: Prepare Release Directory
        run: |
          # Copy api directory into dist/ so it is deployed alongside frontend assets
          cp -r api dist/
          # Copy root .htaccess to dist/
          cp .htaccess dist/
          # Remove any local config file if it leaked in
          rm -f dist/api/config/config.php

      - name: Sync Files to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: public_html/
          local-dir: ./dist/
